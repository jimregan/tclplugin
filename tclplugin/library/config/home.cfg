# home.cfg --
#
#	Configuration file for the "home" policy.
#
#       Check the 'config.n' manual page for more details on the format
#	of this and other configuration files.
#
#       This file (home.cfg) is not supposed to be edited. You can copy
#       it under a new name to make another policy to suit your particular
#       needs (if you need a different behaviour for the regular 'home' 
#       policy), but if you change this file, some tclets that expect
#       the "standard" 'home' will probably fail and your tclets that would
#       take advantage of the new 'home' would not work for other people
#       anyway.
#
# CONTACT:		sunscript-plugin@sunscript.sun.com
