# plugin.cfg --
#
#       This file is the first level of access control.
#
#       It determines if a given policy is allowed for a given tclet.       
#       It also declares the list of available features in the current
#       configuration. Each policy's .cfg will then select which of those
#       features it allows.
#
#       Check the 'config.n' manual page for more details on the format
#	of this and other configuration files.
#
#	This file is meant to be edited by system and site administrators
#	to allow them to configure the use of policies for their specific
#	system needs. Please read the manual page config.n for more info.
#
# CONTACT:      tclplugin-core@lists.sourceforge.net
