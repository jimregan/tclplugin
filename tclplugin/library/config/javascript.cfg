############################################################
# WARNING ##################################################
############################################################
#
# THIS FILE ALLOWS FULL ACCESS TO THE BROWSER FEATURES.
# =====================================================

# What features are enabled in this policy?

section features
allow url
allow stream
allow network
allow persist

# What URLs are allowed?

section urls
allow *

# What hosts and ports can be used in a socket command?

section hosts ports
allow   *     *

# What mime types are allowed for openStream
section mimeTypes
allow  *

# What frames (targets) are allowed for displayURL,...
# (allowed * means even the empty one is allowed)
section frames
allow *

# What aliases are supported by this policy? In the javascript policy,
# all aliases are supported.

section aliases
allow *
