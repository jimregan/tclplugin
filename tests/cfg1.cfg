# cfg1.cfg -- test configuration file used by cfg.test.

section section1
allow allowed

section section2
allow disallowed
constant constant2 42

# Section 3 does not exist and the test depends on that!

section section4
allow allowed

section section5
allow allowed
allow logic1
disallow logic1
disallow logic2
# logic3 is not defined so it is disallowed -- tested by cfg-6.4.

section section6
allow word1
allow word1 word2
allow word1 word2 word3

section section7
allow word1
disallow word1
allow word1 word2
disallow word1 word2
allow word1 word2 word3
disallow word1 word2 word3
allow word1 word2 word3 word4

section section8
allow word123*

section section9
allow word123*
disallow word1234*

section section10	;# test allowed ranges
allow 99-101
allow 180-199
allow >499
allow >599
allow -150--140
allow <-200
allow <-300

section section11	;# test mixed allow and disallow, ranges
allow 100-200
disallow 105-115
disallow 150
disallow >170
allow 190	;# This won't work because of the disallow >170!!!
allow <50
disallow <40
disallow < 30	;# This doesn't do anything because of the disallow<40!!!

section section12	;# test multiple word allow, wildcards
allow word123* word456*
allow word345 word4*
allow word135* word456

section scope-1a ; # test variable access
allow $foo1

set foo1 46 

section scope-1b ; # test that we changed the local copy
allow $foo1

# in cfg2.test we test that we have not changed everything

section scope-2a; # test that we have access to global one
allow $foo2

variable foo2 -46

section scope-2b ; # test that we changed it
allow $foo2

# in cfg2.test we test that we *have* changed foo2

#
section constant-1
  constant foo bar
  allow $foo

# used by ifallowed indirections
section ifallowed-0
  disallow bar
  allow sub-blah

# backward reference
section ifallowed-1
  allow blah ifallowed ifallowed-0 sub-blah
  allow foo1  ifallowed ifallowed-0 bar
  allow foo2  ifallowed ifallowed-0 none

# forward reference
section ifallowed-2
  allow blah ifallowed ifallowed-00 sub-blah
  allow foo1  ifallowed ifallowed-00 bar
  allow foo2  ifallowed ifallowed-00 none

# nasty section
section recurs-1
  log {} "TST recurs res=[ifallowed "cfg2/ifa2-4 ifa2-44" xx yy]"
  allow rec1

# used by ifallowed indirections
section ifallowed-00
  disallow bar
  allow sub-blah

section ifallowed-3
  allow blah3 ifallowed {ifa1 ifa11} x y
  allow foo3  ifallowed {ifa1 ifa11} x z
  allow foo4  ifallowed {ifa1 ifa11} z y
  allow foo5  ifallowed {ifa1 ifa11} sub-blah  ; # <- on purpose error

section ifa1 ifa11
  allow x y


section ifallowed-4
  allow blah44 ifallowed "cfg2/ifa2-4 ifa2-44" xx yy
  allow foo44  ifallowed "cfg2/ifa2-4 ifa2-44" xx zz

section ifallowed-5
  allow blah55 ifallowed cfg2/ifa5 xxx
  allow foo55  ifallowed cfg2/ifa5 zzz

